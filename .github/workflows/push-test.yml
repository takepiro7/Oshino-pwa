name: OshiNow urgent push test

on:
  workflow_dispatch:

jobs:
  send-test:
    runs-on: ubuntu-latest
    steps:
      - name: Validate secrets
        env:
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
          ONESIGNAL_SUBSCRIPTION_ID: ${{ secrets.ONESIGNAL_SUBSCRIPTION_ID }}
          ONESIGNAL_SUBSCRIPTION_IDS: ${{ secrets.ONESIGNAL_SUBSCRIPTION_IDS }}
        run: |
          test -n "$ONESIGNAL_REST_API_KEY" || (echo "::error::Missing ONESIGNAL_REST_API_KEY" && exit 1)
          if [ -z "$ONESIGNAL_SUBSCRIPTION_ID" ] && [ -z "$ONESIGNAL_SUBSCRIPTION_IDS" ]; then
            echo "::error::Missing OneSignal subscription IDs"
            exit 1
          fi

      - name: Send urgent test push
        env:
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
          ONESIGNAL_SUBSCRIPTION_ID: ${{ secrets.ONESIGNAL_SUBSCRIPTION_ID }}
          ONESIGNAL_SUBSCRIPTION_IDS: ${{ secrets.ONESIGNAL_SUBSCRIPTION_IDS }}
        run: |
          python - <<'PY'
          import json, os, re, urllib.request, urllib.error

          raw = os.environ.get("ONESIGNAL_SUBSCRIPTION_IDS", "").strip()
          if not raw:
              raw = os.environ.get("ONESIGNAL_SUBSCRIPTION_ID", "").strip()

          uuid_re = re.compile(r"[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}")
          ids = []
          for value in uuid_re.findall(raw):
              if value not in ids:
                  ids.append(value)

          if not ids:
              print("No valid Subscription IDs found.")
              raise SystemExit(2)

          print(f"Testing push to {len(ids)} subscription(s).")

          payload = {
              "app_id": "d40f1748-dbb5-472a-aaa1-5178eb3ed064",
              "target_channel": "push",
              "include_subscription_ids": ids,
              "headings": {"ja": "OshiNow 🔴 配信予兆", "en": "OshiNow"},
              "contents": {
                  "ja": "何？ 配信が始まる可能性\nいつ？ まもなく\nすること：Instagram / YouTubeを確認",
                  "en": "Livestream may start soon",
              },
              "url": "https://takepiro7.github.io/Oshino-pwa/?notice=urgent-test",
              "data": {"source": "oshinow_test", "prediction": "urgent"},
          }
          req = urllib.request.Request(
              "https://api.onesignal.com/notifications",
              data=json.dumps(payload).encode(),
              headers={
                  "Authorization": "Key " + os.environ["ONESIGNAL_REST_API_KEY"],
                  "Content-Type": "application/json",
              },
              method="POST",
          )
          try:
              with urllib.request.urlopen(req, timeout=20) as r:
                  print(r.read().decode())
          except urllib.error.HTTPError as e:
              body = e.read().decode()
              print(f"HTTP {e.code}: {body}")
              raise
          PY
