name: OshiNow official feed watch

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/check_genjibu.py"
      - ".github/workflows/news-watch.yml"
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

concurrency:
  group: oshinow-news-watch
  cancel-in-progress: false

jobs:
  check-news:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Check required secret
        env:
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
          ONESIGNAL_SUBSCRIPTION_ID: ${{ secrets.ONESIGNAL_SUBSCRIPTION_ID }}
          ONESIGNAL_SUBSCRIPTION_IDS: ${{ secrets.ONESIGNAL_SUBSCRIPTION_IDS }}
        run: |
          if [ -z "$ONESIGNAL_REST_API_KEY" ]; then
            echo "::error::GitHub secret ONESIGNAL_REST_API_KEY is not configured."
            exit 1
          fi

      - name: Check official feeds and notify
        env:
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
          ONESIGNAL_SUBSCRIPTION_ID: ${{ secrets.ONESIGNAL_SUBSCRIPTION_ID }}
          ONESIGNAL_SUBSCRIPTION_IDS: ${{ secrets.ONESIGNAL_SUBSCRIPTION_IDS }}
        run: python scripts/check_genjibu.py

      - name: Save watcher state
        run: |
          if git diff --quiet -- data/news_seen.json data/events.json data/artists.json; then
            echo "No state change."
            exit 0
          fi
          git config user.name "oshinow-bot"
          git config user.email "actions@users.noreply.github.com"
          tmpdir="$(mktemp -d)"
          cp data/news_seen.json "$tmpdir/news_seen.json"
          cp data/events.json "$tmpdir/events.json"
          if [ -f data/artists.json ]; then cp data/artists.json "$tmpdir/artists.json"; fi
          git fetch origin main
          git reset --hard origin/main
          mkdir -p data
          cp "$tmpdir/news_seen.json" data/news_seen.json
          cp "$tmpdir/events.json" data/events.json
          if [ -f "$tmpdir/artists.json" ]; then cp "$tmpdir/artists.json" data/artists.json; fi
          git add data/news_seen.json data/events.json data/artists.json
          if git diff --cached --quiet; then
            echo "Generated data already current."
            exit 0
          fi
          git commit -m "Update OshiNow watcher state and calendar"
          git push
