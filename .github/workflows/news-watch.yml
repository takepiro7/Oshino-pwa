name: OshiNow official news watch

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

concurrency:
  group: oshinow-news-watch
  cancel-in-progress: false

jobs:
  check-news:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Check required secret
        env:
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
        run: |
          if [ -z "$ONESIGNAL_REST_API_KEY" ]; then
            echo "::error::GitHub secret ONESIGNAL_REST_API_KEY is not configured."
            exit 1
          fi

      - name: Check official NEWS and notify
        env:
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
        run: python scripts/check_genjibu.py

      - name: Save watcher state
        run: |
          if git diff --quiet -- data/news_seen.json; then
            echo "No state change."
            exit 0
          fi
          git config user.name "oshinow-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/news_seen.json
          git commit -m "Update OshiNow news watcher state"
          git push
